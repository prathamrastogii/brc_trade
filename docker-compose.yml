services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brc
      POSTGRES_PASSWORD: brc
      POSTGRES_DB: brc_trade
    ports:
      - "5432:5432"
    volumes:
      - brc_pg_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brc -d brc_trade"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  brc_pg_data:
